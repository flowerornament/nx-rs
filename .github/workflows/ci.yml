name: CI

on:
  push:
    branches: [main]
  pull_request:

env:
  CARGO_TERM_COLOR: always

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - name: Install pinned Rust toolchain
        uses: actions-rust-lang/setup-rust-toolchain@v1
        with:
          rustflags: ""

      - name: Verify pinned Rust toolchain
        run: rustup show active-toolchain

      - uses: taiki-e/install-action@just

      - name: CI gate
        run: just ci

      - name: System tests
        run: just test-system

      - name: Build release binary
        run: just build

  nix-home-manager-smoke:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - name: Install Nix
        uses: DeterminateSystems/nix-installer-action@main

      - name: Home Manager module smoke test
        run: bash scripts/test-home-manager-module.sh

      - name: Flake package smoke test
        run: |
          nix build .
          nix run . -- --help >/dev/null
