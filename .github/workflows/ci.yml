name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0

      - name: Install pinned Rust toolchain
        uses: actions-rust-lang/setup-rust-toolchain@166cdcfd11aee3cb47222f9ddb555ce30ddb9659 # v1
        with:
          rustflags: ""

      - name: Verify pinned Rust toolchain
        run: rustup show active-toolchain

      - uses: taiki-e/install-action@be5d41457cdd7bd9986d07500bf51a8c67803dbf # just

      - name: CI gate
        run: just ci

      - name: System tests
        run: just test-system

      - name: Build release binary
        run: just build

  nix-home-manager-smoke:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0

      - name: Install Nix
        uses: cachix/install-nix-action@630ae543ea3a38a9a4166f03376c02c50f408342 # v31.11.0
        with:
          extra_nix_config: experimental-features = nix-command flakes

      - name: Home Manager module smoke test
        run: bash scripts/test-home-manager-module.sh

      - name: Flake package smoke test
        run: |
          nix build --accept-flake-config .
          nix run --accept-flake-config . -- --help >/dev/null
