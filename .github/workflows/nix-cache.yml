name: Nix Cache

on:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: nix-cache-${{ github.ref }}
  cancel-in-progress: false

jobs:
  cache:
    uses: ./.github/workflows/nix-cache-package.yml
    with:
      executable: nx
      matrix: >-
        [
          {"system":"aarch64-darwin","runner":"macos-15"},
          {"system":"x86_64-darwin","runner":"macos-15-intel"},
          {"system":"aarch64-linux","runner":"ubuntu-24.04-arm"},
          {"system":"x86_64-linux","runner":"ubuntu-24.04"}
        ]
    secrets:
      CACHIX_AUTH_TOKEN: ${{ secrets.CACHIX_AUTH_TOKEN }}
