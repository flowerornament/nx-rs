[package]
name = "nx-rs"
version = "1.5.27"
edition = "2024"
publish = false
license = "MIT"

[[bin]]
name = "nx"
path = "src/main.rs"

[dependencies]
anyhow = "1"
clap = { version = "4.5.53", features = ["derive"] }
regex = "1.12.2"
serde = { version = "1.0.228", features = ["derive"] }
serde_json = { version = "1.0.145", features = ["preserve_order"] }
rnix = "0.11"
rowan = "0.15"
toml_edit = "0.22"
walkdir = "2.5.0"
claude-codes = { version = "2.1.52", default-features = false, features = ["types", "sync-client"] }
uuid = { version = "1", features = ["v4"] }
clap_complete = "4.6.0"

[dev-dependencies]
insta = { version = "1.46.3", features = ["json"] }
tempfile = "3.23.0"

[profile.dev]
debug = 0

[profile.test]
inherits = "dev"
debug = 0

[profile.release]
strip = "symbols"

[lints.rust]
unsafe_code = "forbid"

[lints.clippy]
all = { level = "warn", priority = -1 }
pedantic = { level = "warn", priority = -1 }
explicit_iter_loop = "warn"
inefficient_to_string = "warn"
semicolon_if_nothing_returned = "warn"
