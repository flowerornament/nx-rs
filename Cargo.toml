[package]
name = "nx-rs"
version = "1.5.32"
edition = "2024"
publish = false
license = "MIT"

[[bin]]
name = "nx"
path = "src/main.rs"

[dependencies]
anyhow = "1"
clap = { version = "4.5.53", features = ["derive"] }
regex = "1.12.2"
serde = { version = "1.0.228", features = ["derive"] }
serde_json = { version = "1.0.145", features = ["preserve_order", "raw_value"] }
rnix = "0.11"
rowan = "0.15"
toml_edit = "0.22"
walkdir = "2.5.0"
claude-codes = { version = "2.1.52", default-features = false, features = ["types", "sync-client"] }
uuid = { version = "1", features = ["v4"] }
clap_complete = "4.6.0"
rustix-openpty = "0.2.0"
rustix = { version = "1.1.4", features = ["fs", "std", "stdio", "termios"] }

[dev-dependencies]
insta = { version = "1.46.3", features = ["json"] }
tempfile = "3.23.0"

[profile.dev]
debug = 0

[profile.test]
inherits = "dev"
debug = 0

[profile.release]
strip = "symbols"

[lints.rust]
unsafe_code = "forbid"
unused_must_use = "deny"
elided_lifetimes_in_paths = "warn"

[lints.clippy]
all = { level = "warn", priority = -1 }
pedantic = { level = "warn", priority = -1 }
explicit_iter_loop = "warn"
inefficient_to_string = "warn"
semicolon_if_nothing_returned = "warn"

# Nursery lints with a low noise floor in this codebase. Avoid enabling the
# whole group: some nursery lints are intentionally experimental or mostly
# style churn for nx-rs.
as_ptr_cast_mut = "warn"
clear_with_drain = "warn"
coerce_container_to_any = "warn"
collection_is_never_read = "warn"
debug_assert_with_mut_call = "warn"
derive_partial_eq_without_eq = "warn"
equatable_if_let = "warn"
fallible_impl_from = "warn"
future_not_send = "warn"
iter_on_empty_collections = "warn"
iter_on_single_items = "warn"
large_stack_frames = "warn"
literal_string_with_formatting_args = "warn"
needless_pass_by_ref_mut = "warn"
needless_type_cast = "warn"
non_send_fields_in_send_ty = "warn"
path_buf_push_overwrite = "warn"
read_zero_byte_vec = "warn"
redundant_clone = "warn"
set_contains_or_insert = "warn"
significant_drop_in_scrutinee = "warn"
single_option_map = "warn"
string_lit_as_bytes = "warn"
suspicious_operation_groupings = "warn"
trait_duplication_in_bounds = "warn"
transmute_undefined_repr = "warn"
type_repetition_in_bounds = "warn"
uninhabited_references = "warn"
unnecessary_struct_initialization = "warn"
unused_peekable = "warn"
unused_rounding = "warn"
use_self = "warn"
while_float = "warn"
